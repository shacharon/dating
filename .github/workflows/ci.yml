# Sprint 20 Story 4 — CI on every PR and push.
# Always runs both packages (monorepo): shared contracts / env coupling.

name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "deploy/**"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      package: dating-api

  ui:
    uses: ./.github/workflows/reusable-node-ci.yml
    with:
      package: dating-ui

  # Aggregate gate for branch protection (require this check, not each matrix leg).
  ci-ok:
    name: CI green
    needs: [api, ui]
    runs-on: ubuntu-latest
    if: always()
    steps:
      - name: Require API + UI success
        run: |
          if [ "${{ needs.api.result }}" != "success" ] || [ "${{ needs.ui.result }}" != "success" ]; then
            echo "API=${{ needs.api.result }} UI=${{ needs.ui.result }}"
            exit 1
          fi
          echo "CI green"
