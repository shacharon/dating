# HG ranking: fail if ranking falls back to deterministicSpread or enrichment/snapshot coverage drops.
# Uses Postgres service + `ci-seed-hg-validation-minimal.ts` + `npm run ci:hg-ranking-guard`.
# Advanced: point the whole job at a remote DB by setting env DATABASE_URL via a repository/environment secret.
name: HG ranking signal guard

permissions:
  contents: read

on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master

defaults:
  run:
    working-directory: dating-api

jobs:
  hg-ranking-signal-guard:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dating_hg_guard
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dating_hg_guard"
          --health-interval 4s
          --health-timeout 5s
          --health-retries 12

    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/dating_hg_guard

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: dating-api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate & migrate
        run: npx prisma generate && npx prisma migrate deploy

      - name: Seed minimal HG validation pool (CI fixture)
        run: npx ts-node scripts/ci-seed-hg-validation-minimal.ts

      - name: HG ranking signal CI guard
        run: npm run ci:hg-ranking-guard
